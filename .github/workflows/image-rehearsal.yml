name: OpFlex manual rehearsal

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed source branch or full commit SHA
        required: true
        type: string
      test_version:
        description: Test release identity (N.N.N.N)
        required: true
        type: string
      stream:
        description: Release stream in the personal rehearsal namespace
        required: true
        default: z
        type: choice
        options: [z, rc, release]
      rc_number:
        description: Positive RC number, only for RC stream
        required: false
        type: string
      cicd_ref:
        description: Optional reviewed CICD branch or full SHA (resolved once)
        required: false
        type: string
      base_digest:
        description: Approved captured opflex-build-base sha256 digest (required for runtime)
        required: false
        type: string
      operation:
        description: Explicit image operation
        required: true
        default: runtime
        type: choice
        options: [runtime, base]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve immutable rehearsal inputs without publication credentials
    if: github.repository == 'anmol372/opflex' && github.ref == 'refs/heads/anmrasto/gha-rehearsal-20261119'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      source-sha: ${{ steps.source.outputs.source_sha }}
      source-ref: ${{ steps.source.outputs.source_ref }}
      release-tag: ${{ steps.source.outputs.release_tag }}
      date-tag: ${{ steps.source.outputs.date_tag }}
      cicd-commit: ${{ steps.cicd.outputs.cicd_commit }}
      operation: ${{ steps.source.outputs.operation }}
      base-digest: ${{ steps.source.outputs.base_digest }}
      stream: ${{ steps.source.outputs.stream }}
      rc-number: ${{ steps.source.outputs.rc_number }}
    steps:
      - name: Check out workflow execution revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Capture requested CICD revision once
        id: cicd
        shell: bash
        env:
          REQUESTED_CICD_REF: ${{ inputs.cicd_ref }}
          REVIEWED_CICD_DEFAULT: 508cdc562f2ae11b0aab5b2a380285e4b43d936a
        run: |
          set -Eeuo pipefail
          requested="${REQUESTED_CICD_REF:-${REVIEWED_CICD_DEFAULT}}"
          if [[ "${requested}" =~ ^[0-9a-f]{40}$ ]]; then
            ref="${requested}"
          else
            branch="${requested#refs/heads/}"
            [[ "${branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] &&
              git check-ref-format --branch "${branch}" >/dev/null || {
                echo '::error::cicd_ref must be a branch or full commit SHA'; exit 1;
              }
            ref="refs/heads/${branch}"
          fi
          git init --quiet "${RUNNER_TEMP}/cicd"
          git -C "${RUNNER_TEMP}/cicd" remote add origin https://github.com/anmol372/cicd.git
          git -C "${RUNNER_TEMP}/cicd" fetch --depth=1 --no-tags origin "${ref}"
          git -C "${RUNNER_TEMP}/cicd" checkout --quiet --detach FETCH_HEAD
          commit="$(git -C "${RUNNER_TEMP}/cicd" rev-parse HEAD)"
          [[ "${commit}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "${requested}" =~ ^[0-9a-f]{40}$ && "${commit}" != "${requested}" ]]; then
            echo '::error::Fetched CICD commit differs from requested SHA'; exit 1
          fi
          echo "cicd_commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Resolve source, release and selected base
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
          REQUESTED_VERSION: ${{ inputs.test_version }}
          REQUESTED_STREAM: ${{ inputs.stream }}
          REQUESTED_RC_NUMBER: ${{ inputs.rc_number }}
          REQUESTED_OPERATION: ${{ inputs.operation || 'runtime' }}
          REQUESTED_BASE_DIGEST: ${{ inputs.base_digest }}
        run: |
          set -Eeuo pipefail
          python3 "${RUNNER_TEMP}/cicd/travis/rehearsal_inputs.py" \
            --source-directory "${GITHUB_WORKSPACE}" --source-ref="${REQUESTED_SOURCE_REF}" \
            --test-version="${REQUESTED_VERSION}" --stream="${REQUESTED_STREAM}" \
            --rc-number="${REQUESTED_RC_NUMBER}" --operation="${REQUESTED_OPERATION}" \
            --base-digest="${REQUESTED_BASE_DIGEST}" --github-output "${GITHUB_OUTPUT}"

  build-and-publish:
    name: Build and publish selected rehearsal images
    needs: [resolve]
    environment: gha-rehearsal
    concurrency:
      # Streams of one release share plain/dated/z tags; never cancel active writes.
      group: ${{ format('opflex-rehearsal-{0}-{1}', needs.resolve.outputs.release-tag, needs.resolve.outputs.operation) }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CI_REHEARSAL: "1"
      CI_REHEARSAL_STREAM: ${{ needs.resolve.outputs.stream }}
      CI_REHEARSAL_RC_NUMBER: ${{ needs.resolve.outputs.rc-number }}
      UPSTREAM_ID: a378a7d
      TRAVIS_TAG: ${{ needs.resolve.outputs.release-tag }}
      TRAVIS_COMMIT: ${{ needs.resolve.outputs.source-sha }}
      TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
      TRAVIS_REPO_SLUG: ${{ github.repository }}
      TRAVIS_JOB_WEB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GHA_DATE_TAG: ${{ needs.resolve.outputs.date-tag }}
      CICD_COMMIT: ${{ needs.resolve.outputs.cicd-commit }}
      SELECTED_SOURCE_REF: ${{ needs.resolve.outputs.source-ref }}
      EXPECTED_OPFLEX_BASE_DIGEST: ${{ needs.resolve.outputs.base-digest }}
      CI_ARTIFACT_DIR: ci-artifacts
      CI_EVIDENCE_MODE: prepared-v1
      CI_SCAN_POLICY: advisory
      DOCKER_BUILDKIT: "1"
      GHA_PLATFORM: linux/amd64
      GHA_OPFLEX_BUILD_PHASE: ${{ needs.resolve.outputs.operation }}

    steps:
      - name: Require reviewed source and helper before selected code runs
        shell: bash
        env:
          REVIEWED_SOURCE_SHA: ${{ vars.REHEARSAL_SOURCE_SHA }}
          REVIEWED_CICD_SHA: ${{ vars.REHEARSAL_CICD_SHA }}
        run: |
          set -Eeuo pipefail
          [[ "${REVIEWED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ &&
             "${TRAVIS_COMMIT}" == "${REVIEWED_SOURCE_SHA}" &&
             "${REVIEWED_CICD_SHA}" =~ ^[0-9a-f]{40}$ &&
             "${CICD_COMMIT}" == "${REVIEWED_CICD_SHA}" ]] || {
            echo '::error::Selected SHAs must match the scoped Environment reviewed SHA variables'; exit 1;
          }

      - name: Check out validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Java 11 for Genie
        if: needs.resolve.outputs.operation == 'runtime'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: genie/pom.xml

      - name: Install status dependencies and clone resolved CICD scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install pyyaml pytz
          cicd_dir="${RUNNER_TEMP}/cicd"
          [[ "${CICD_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid reviewed CICD SHA"; exit 1; }
          git init --quiet "${cicd_dir}"
          git -C "${cicd_dir}" remote add origin https://github.com/anmol372/cicd.git
          git -C "${cicd_dir}" fetch --depth=1 origin "${CICD_COMMIT}"
          git -C "${cicd_dir}" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "${cicd_dir}" rev-parse HEAD)" == "${CICD_COMMIT}" ]] || {
            echo "::error::CICD checkout does not match resolved helper SHA"; exit 1;
          }
          {
            echo "CICD_DIR=${cicd_dir}"
            echo "DOCKER_CONFIG=${RUNNER_TEMP}/opflex-docker-config"
          } >> "${GITHUB_ENV}"

      - name: Authenticate to private rehearsal registry
        shell: bash
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_REHEARSAL_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_REHEARSAL_TOKEN }}
        run: |
          set -Eeuo pipefail
          : "${QUAY_USERNAME:?}" "${QUAY_TOKEN:?}"
          install -d -m 700 "${DOCKER_CONFIG}"
          printf '%s' "${QUAY_TOKEN}" | docker login quay.io \
            --username "${QUAY_USERNAME}" --password-stdin

      - name: Build selected images through CICD
        id: build
        shell: bash
        env:
          CI_QUAY_USERNAME: ${{ secrets.QUAY_REHEARSAL_USERNAME }}
          CI_QUAY_TOKEN: ${{ secrets.QUAY_REHEARSAL_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${CI_ARTIFACT_DIR}"
          build_log="${RUNNER_TEMP}/opflex-build-and-publish.log"
          trap 'if [[ -f "${build_log}" ]]; then cp -- "${build_log}" "${CI_ARTIFACT_DIR}/build-and-publish.log"; fi' EXIT
          SKIP_CICD_STATUS=true "${CICD_DIR}/travis/build-push-opflex-images.sh" \
            2>&1 | tee "${build_log}"

      - name: Retain explicit base output receipt
        if: steps.build.outcome == 'success' && needs.resolve.outputs.operation == 'base'
        shell: bash
        run: |
          set -Eeuo pipefail
          reference="quay.io/anmrasto/opflex-build-base:${TRAVIS_TAG}.${UPSTREAM_ID}"
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${reference}" \
            | sed -n 's|^quay.io/anmrasto/opflex-build-base@||p')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::Cannot resolve published test base digest'; exit 1;
          }
          printf 'opflex_build_base_ref=quay.io/anmrasto/opflex-build-base@%s\nopflex_build_base_digest=%s\nsource_sha=%s\ncicd_sha=%s\n' \
            "${digest}" "${digest}" "${TRAVIS_COMMIT}" "${CICD_COMMIT}" \
            > "${CI_ARTIFACT_DIR}/opflex-build-base-receipt.txt"
          printf 'Captured base digest: `%s`\n' "${digest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove registry credentials
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/opflex-docker-config/config.json" \
            "${RUNNER_TEMP}/opflex-quay-noiro-docker-config/config.json"

      - name: Prepare immutable image evidence
        id: evidence
        if: ${{ always() && needs.resolve.outputs.operation == 'runtime' && (steps.build.outcome == 'success' || hashFiles('ci-artifacts/image-metadata.jsonl') != '') }}
        shell: bash
        env:
          IMAGE_BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -Eeuo pipefail
          [[ -s "${CI_ARTIFACT_DIR}/image-metadata.jsonl" ]] || {
            echo "::error::Image build produced no nonempty image metadata"; exit 1;
          }
          args=(--source-ref "${SELECTED_SOURCE_REF}")
          if [[ "${IMAGE_BUILD_OUTCOME}" == success ]]; then
            args+=(--expected-images "opflex")
          fi
          python3 "${CICD_DIR}/travis/ci_evidence.py" prepare-images \
            --metadata "${CI_ARTIFACT_DIR}/image-metadata.jsonl" \
            --bundle "${CI_ARTIFACT_DIR}/status-bundle" \
            --release-tag "${TRAVIS_TAG}" --source-repository "${GITHUB_REPOSITORY}" \
            --source-sha "${TRAVIS_COMMIT}" --run-id "${GITHUB_RUN_ID}" \
            --run-number "${GITHUB_RUN_NUMBER}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-url "${TRAVIS_JOB_WEB_URL}" \
            --upstream-id "${UPSTREAM_ID}" ${args[@]+"${args[@]}"}
          echo "prepared=true" >> "${GITHUB_OUTPUT}"

      - name: Publish prepared image status
        if: ${{ always() && vars.REHEARSAL_PUBLISH_STATUS == 'true' && steps.evidence.outputs.prepared == 'true' }}
        shell: bash
        env:
          TRAVIS_TAGGER: ${{ secrets.TEST_CICD_STATUS_TOKEN }}
        run: |
          set -Eeuo pipefail
          status_repository=https://github.com/noironetworks/test-cicd-status.git
          status_branch="anmrasto/gha-rehearsal-${TRAVIS_TAG}"
          python3 "${CICD_DIR}/travis/ci_evidence.py" publish \
            --bundle "${CI_ARTIFACT_DIR}/status-bundle" \
            --expected-release-tag "${TRAVIS_TAG}" --expected-kind images \
            --expected-stream "${TRAVIS_TAG}.z" \
            --expected-source-repository "${GITHUB_REPOSITORY}" --expected-source-sha "${TRAVIS_COMMIT}" \
            --expected-cicd-sha "${CICD_COMMIT}" --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-run-attempt "${GITHUB_RUN_ATTEMPT}" --expected-images "opflex" \
            --repository "${status_repository}" --branch "${status_branch}"

      - name: Upload rehearsal receipts and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opflex-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
